# このファイルは lounge/update_tool_list.py が自動で作っています。
# 選択肢を変えたいときは tools フォルダの中身を変えてください(直接書き換えても次回上書きされます)。
name: 🛋️ AIラウンジでお題を出す
description: ClaudeとGeminiに、このお題について意見交換してもらいます
title: "【ラウンジ】"
body:
  - type: markdown
    attributes:
      value: |
        タイトルの「【ラウンジ】」の後ろにお題を書いて、下に詳しい説明があれば書いてください。
        送信すると、数分以内にAIたちがコメント欄で議論を始めます。

        **AIたちに話題を決めてほしいとき**は、タイトルを「【ラウンジ】おまかせ」にして送信してください。

        **作ったツールを見てもらいたいとき**は、下の「見てもらうツール(任意)」から選んでください(複数選べます)。
        一覧にないときは、ツールを `tools` フォルダに入れると1〜2分で選べるようになります。
  - type: dropdown
    id: tool
    attributes:
      label: "見てもらうツール(任意)"
      multiple: true
      options:
        - "(なし)"
        - "drawr.html"
        - "gradio_app_large_long_final_updated (1).py"
      default: 0
    validations:
      required: false
  - type: textarea
    id: detail
    attributes:
      label: "お題の詳しい説明(任意)"
      placeholder: |
        例)背景や、特に話し合ってほしい点など
