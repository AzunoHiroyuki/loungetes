name: ツール一覧の更新

# tools フォルダが変わったら、お題フォームの「見てもらうツール」の選択肢を作り直す
on:
  push:
    branches: [main]
    paths: ["tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-tools
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 選択肢を作り直す
        run: python lounge/update_tool_list.py
      - name: 変更があれば保存する
        run: |
          if git diff --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/ISSUE_TEMPLATE/lounge.yml
          git commit -m "ツール一覧を更新"
          git pull --rebase origin main
          git push origin HEAD:main
